name: pages

on:
  push:
    branches: [main]
    paths: ["docs-site/**"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Refuse a superseded target commit
        id: current
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          EVENT=$(git log -1 --format=%H "$GITHUB_SHA" -- docs-site)
          CURRENT=$(git log -1 --format=%H refs/remotes/origin/main -- docs-site)
          test -n "$EVENT"
          test -n "$CURRENT"
          if [ "$CURRENT" != "$EVENT" ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "Docs publication $EVENT was superseded by $CURRENT before upload."
            exit 0
          fi
          MESSAGE=$(git show -s --format=%B "$EVENT")
          SOURCE_REPOSITORY_COUNT=$(printf '%s\n' "$MESSAGE" | sed -n '/^Workflows-Source-Repository: /p' | wc -l)
          SOURCE_SHA_COUNT=$(printf '%s\n' "$MESSAGE" | sed -n '/^Workflows-Source-Commit: /p' | wc -l)
          SITE_SHA_COUNT=$(printf '%s\n' "$MESSAGE" | sed -n '/^Workflows-Site-SHA256: /p' | wc -l)
          test "$SOURCE_REPOSITORY_COUNT" -eq 1
          test "$SOURCE_SHA_COUNT" -eq 1
          test "$SITE_SHA_COUNT" -eq 1
          SOURCE_REPOSITORY=$(printf '%s\n' "$MESSAGE" | sed -n 's/^Workflows-Source-Repository: \([A-Za-z0-9_.-]\+\/[A-Za-z0-9_.-]\+\)$/\1/p')
          SOURCE_SHA=$(printf '%s\n' "$MESSAGE" | sed -n 's/^Workflows-Source-Commit: \([0-9a-f]\{40\}\)$/\1/p')
          SITE_SHA=$(printf '%s\n' "$MESSAGE" | sed -n 's/^Workflows-Site-SHA256: \([0-9a-f]\{64\}\)$/\1/p')
          test -n "$SOURCE_REPOSITORY"
          test -n "$SOURCE_SHA"
          test -n "$SITE_SHA"
          echo "superseded=false" >> "$GITHUB_OUTPUT"
          echo "publication=$EVENT" >> "$GITHUB_OUTPUT"
          echo "source-sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload the current docs-site tree
        if: steps.current.outputs.superseded == 'false'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs-site

      - name: Deploy to GitHub Pages
        if: steps.current.outputs.superseded == 'false'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Check whether the deployed commit is still current
        if: steps.current.outputs.superseded == 'false'
        id: current-after
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          CURRENT=$(git log -1 --format=%H refs/remotes/origin/main -- docs-site)
          if [ "$CURRENT" != "${{ steps.current.outputs.publication }}" ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "Docs publication ${{ steps.current.outputs.publication }} deployed, then was superseded by $CURRENT. Its result is not current."
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke the served root and asset closure
        if: steps.current.outputs.superseded == 'false' && steps.current-after.outputs.superseded == 'false'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: ${{ steps.current.outputs.source-sha }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const pageUrl = process.env.PAGE_URL;
          const sourceSha = process.env.SOURCE_SHA;
          if (!pageUrl || !sourceSha) throw new Error("Pages smoke is missing its deployment facts");

          const root = new URL(pageUrl);
          root.searchParams.set("source", sourceSha);
          const queue = [root];
          const visited = new Set();
          let rootHtml = "";

          const refs = (body, type) => {
            const found = [];
            const patterns = type.includes("text/html")
              ? [/\b(?:src|href)=["']([^"']+)["']/g]
              : type.includes("text/css")
                ? [/url\(\s*["']?([^"')]+)["']?\s*\)/g, /@import\s+(?:url\()?\s*["']?([^"')\s;]+)["']?/g]
                : type.includes("javascript")
                  ? [/\bimport\s*(?:\(|)\s*["']([^"']+)["']/g]
                  : [];
            for (const pattern of patterns) {
              for (const match of body.matchAll(pattern)) found.push(match[1]);
            }
            return found;
          };

          while (queue.length) {
            const url = queue.shift();
            url.hash = "";
            const key = url.href;
            if (visited.has(key)) continue;
            if (visited.size >= 200) throw new Error("Pages asset closure exceeded 200 same-origin resources");
            visited.add(key);
            const response = await fetch(url, {
              redirect: "follow",
              headers: { "cache-control": "no-cache", pragma: "no-cache" },
            });
            if (!response.ok) throw new Error(`${url.href} returned ${response.status}`);
            const type = response.headers.get("content-type") ?? "";
            const body = await response.text();
            if (key === root.href) rootHtml = body;
            for (const ref of refs(body, type)) {
              if (/^(?:data:|mailto:|tel:|#)/i.test(ref)) continue;
              const linked = new URL(ref, url);
              if (linked.origin === root.origin) queue.push(linked);
            }
          }

          for (const expected of ["Work moves forward", "See one item move", "Sign in", 'id="item-trace"']) {
            if (!rootHtml.includes(expected)) throw new Error(`served root is missing ${expected}`);
          }
          console.log(`Smoked ${visited.size} same-origin resources for source ${sourceSha}.`);
          NODE
